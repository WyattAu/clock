[package]
name = "chronoshift"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Trait-based time abstraction with mock clock for testing"
repository = "https://github.com/WyattAu/clock"
keywords = ["time", "clock", "mock", "testing"]
categories = ["rust-patterns", "development-tools::testing"]
exclude = ["/target"]

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false }

js-sys = { version = "0.3", optional = true }

# Targets without 64-bit atomics (e.g. thumbv7em) fall back to a
# critical-section-backed lock. The critical-section implementation itself is
# provided by the final binary (chip HAL), per critical-section convention.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
critical-section = { version = "1", default-features = false, features = ["restore-state-u8"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "head_to_head"
harness = false

[features]
default = ["std", "chrono"]
std = []
chrono = ["dep:chrono"]
wasm = ["dep:js-sys"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
